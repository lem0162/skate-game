<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0f0f0f"/>

  <!-- Scanline overlay (subtle) -->
  <defs>
    <pattern id="scan" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.025"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#scan)"/>

  <!-- "SKATE" text top -->
  <text x="256" y="180"
        text-anchor="middle"
        font-family="Impact, 'Arial Black', sans-serif"
        font-weight="900"
        font-size="92"
        fill="#f5c518"
        letter-spacing="10">SKATE</text>

  <!-- Ground line under board -->
  <line x1="80" y1="370" x2="432" y2="370" stroke="#444" stroke-width="3" stroke-linecap="round"/>

  <!-- Skateboard deck -->
  <rect x="100" y="296" width="312" height="22" rx="11" fill="#f5c518"/>
  <rect x="100" y="296" width="312" height="22" rx="11" fill="#000" opacity="0.18"/>
  <rect x="100" y="296" width="312" height="10" rx="5" fill="#f5c518"/>

  <!-- Trucks -->
  <rect x="138" y="318" width="22" height="14" fill="#888"/>
  <rect x="352" y="318" width="22" height="14" fill="#888"/>

  <!-- Wheels -->
  <circle cx="149" cy="348" r="22" fill="#e8e8e8" stroke="#333" stroke-width="4"/>
  <circle cx="363" cy="348" r="22" fill="#e8e8e8" stroke="#333" stroke-width="4"/>
  <circle cx="149" cy="348" r="6"  fill="#222"/>
  <circle cx="363" cy="348" r="6"  fill="#222"/>
</svg>
